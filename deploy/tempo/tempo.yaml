# Tempo, single-binary, local filesystem backend.
#
# This is a demo configuration. The two settings worth calling out are the
# ingester flush timings and the metrics_generator: both are tuned so that a
# trace is queryable seconds after it happens, which a production deployment
# would not do.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Defaults are 10s/5m/1h. Shortened so the end-to-end test and a human
  # clicking around do not wait for a block to cut. In production these cost
  # you a block per trace-idle-period and are left alone.
  trace_idle_period: 2s
  max_block_duration: 30s

compactor:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # service-graphs gives the node-graph view in Grafana; span-metrics here
      # is Tempo's own, separate from the collector's spanmetrics connector.
      # Both are enabled so the README can point at either path.
      processors: [service-graphs, span-metrics, local-blocks]
